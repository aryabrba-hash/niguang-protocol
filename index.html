<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
  <meta name="theme-color" content="#070b0f">
  <title>逆光协议｜前额叶反应训练</title>
  <style>
    :root{--bg:#070b0f;--panel:#0d151a;--line:rgba(204,238,229,.14);--muted:#71817e;--text:#eef9f5;--green:#98ff6d;--accent:#98ff6d;--danger:#ff5477;color-scheme:dark}
    *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{min-height:100%;margin:0}body{background:var(--bg);color:var(--text);font-family:Arial,"PingFang SC","Microsoft YaHei",sans-serif;overflow-x:hidden}button{font:inherit}
    .app{min-height:100svh;position:relative;overflow:hidden;background:radial-gradient(circle at 50% 35%,color-mix(in srgb,var(--accent) 10%,transparent),transparent 30rem),#070b0f;transition:.3s}
    .grid{position:fixed;inset:0;pointer-events:none;opacity:.18;background-image:linear-gradient(rgba(158,214,198,.13) 1px,transparent 1px),linear-gradient(90deg,rgba(158,214,198,.13) 1px,transparent 1px);background-size:42px 42px;mask-image:linear-gradient(#000,transparent 92%)}
    .scan{position:fixed;inset:-100% 0;pointer-events:none;opacity:.04;background:repeating-linear-gradient(transparent 0 4px,#fff 5px,transparent 6px);animation:scan 14s linear infinite}
    header{width:min(1120px,calc(100% - 32px));height:72px;margin:auto;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--line);position:relative;z-index:2}
    .brand,.actions{display:flex;align-items:center;gap:11px}.logo{width:38px;height:38px;display:grid;place-items:center;background:var(--accent);color:#071006;font-size:20px;clip-path:polygon(14% 0,100% 0,100% 72%,72% 100%,0 100%,0 14%)}
    .brand div{display:grid;gap:2px}.brand strong{font-size:14px;letter-spacing:.14em}.brand small{font:700 8px monospace;letter-spacing:.18em;color:#667673}.best{display:grid;text-align:right;font:700 14px monospace}.best small{font-size:8px;letter-spacing:.15em;color:#62726f;margin-bottom:4px}
    .sound{width:38px;height:38px;border:1px solid var(--line);border-radius:8px;background:#0d151a;color:#9aaba7;cursor:pointer;font-size:17px}.stage{width:min(760px,calc(100% - 26px));margin:auto;padding:clamp(20px,4vh,38px) 0 24px;position:relative;z-index:2}
    .hud{display:grid;grid-template-columns:1fr auto 1fr;align-items:start;margin-bottom:17px}.stat{display:grid;gap:4px}.stat.right{text-align:right}.stat span{font:700 9px monospace;letter-spacing:.17em;color:#687975}.stat strong{font:800 clamp(22px,5vw,31px) monospace;letter-spacing:-.05em}.stat small{color:var(--accent);font-size:12px}.center{display:grid;justify-items:center;gap:6px}.hearts{display:flex;gap:5px}.heart{color:#33413f;font-size:13px}.heart.alive{color:var(--danger);filter:drop-shadow(0 0 5px #ff547788)}.timer{font:700 8px monospace;letter-spacing:.12em;color:#74847f}.timer b{font-size:17px;color:#fff}
    .console{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:12px}.rule,.energy{min-height:76px;border:1px solid var(--line);background:#0b1217dc;backdrop-filter:blur(10px)}.rule{padding:13px 16px;display:grid;grid-template-columns:auto 1fr;column-gap:13px;align-content:center}.rule i{grid-row:1/3;align-self:stretch;display:grid;place-items:center;padding-right:13px;border-right:1px solid var(--line);color:var(--accent);font:700 8px monospace;letter-spacing:.1em;writing-mode:vertical-rl;font-style:normal}.rule strong{align-self:end;font-size:18px;letter-spacing:.06em}.rule small{font-size:11px;color:#71817e}
    .energy{padding:16px;display:grid;align-content:center;gap:10px}.energy-label{display:grid;grid-template-columns:auto 1fr auto;gap:8px;align-items:center;font:700 9px monospace;letter-spacing:.08em;color:#73827f}.energy-label em{color:var(--accent);font-style:normal}.energy-label b{color:#fff}.track{height:4px;background:#1e292c;overflow:hidden}.track i{display:block;width:0;height:100%;background:var(--accent);box-shadow:0 0 14px var(--accent);transition:width .2s}
    .card{height:clamp(275px,41vh,390px);position:relative;display:grid;place-items:center;overflow:hidden;isolation:isolate;border:1px solid color-mix(in srgb,var(--accent) 28%,transparent);background:linear-gradient(145deg,#111c21f7,#070c0ffb);box-shadow:0 24px 80px #0006;clip-path:polygon(0 0,calc(100% - 22px) 0,100% 22px,100% 100%,22px 100%,0 calc(100% - 22px))}.card:before{content:"";position:absolute;inset:20%;z-index:-1;background:var(--accent);filter:blur(100px);opacity:.07}.rail{position:absolute;top:0;left:0;right:0;height:3px;background:#1e292c}.rail i{display:block;width:100%;height:100%;transform-origin:left;background:var(--accent);box-shadow:0 0 13px var(--accent)}.signal-id{position:absolute;top:17px;left:18px;color:#52615f;font:700 8px monospace;letter-spacing:.16em}.stimulus{display:grid;grid-template-columns:1fr 1fr;align-items:center;gap:clamp(30px,9vw,80px)}.big-arrow{font:200 clamp(80px,19vw,145px)/1 Arial;color:var(--accent);filter:drop-shadow(0 0 20px color-mix(in srgb,var(--accent) 35%,transparent))}.word{font:900 clamp(88px,21vw,158px)/1 Arial;letter-spacing:-.08em}.feedback{position:absolute;bottom:21px;height:14px;font:800 10px monospace;letter-spacing:.13em;color:var(--accent)}.corner{position:absolute;width:18px;height:18px;opacity:.45}.corner.a{top:13px;right:13px;border-top:1px solid var(--accent);border-right:1px solid var(--accent)}.corner.b{bottom:13px;left:13px;border-bottom:1px solid var(--accent);border-left:1px solid var(--accent)}
    .controls{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:12px}.controls button{height:78px;position:relative;border:1px solid var(--line);border-radius:4px;background:linear-gradient(#162025,#0c1216);color:#dce8e4;cursor:pointer;font-weight:900;font-size:18px;letter-spacing:.16em;touch-action:manipulation}.controls button:active{transform:scale(.985);color:var(--accent);border-color:var(--accent)}.controls kbd{position:absolute;right:11px;bottom:9px;font:700 9px monospace;color:#52615f}.note{text-align:center;color:#53625f;font:700 8px monospace;letter-spacing:.2em;margin:13px 0 0}
    .overlay{position:fixed;inset:0;z-index:10;display:grid;place-items:center;padding:18px;background:#030709b8;backdrop-filter:blur(12px)}.modal{width:min(480px,100%);padding:clamp(28px,6vw,46px);position:relative;overflow:hidden;border:1px solid #98ff6d48;background:linear-gradient(145deg,#121c20fc,#070c0fff);box-shadow:0 40px 120px #0009,0 0 60px #98ff6d10;clip-path:polygon(0 0,calc(100% - 22px) 0,100% 22px,100% 100%,0 100%)}.kicker{color:var(--green);font:800 9px monospace;letter-spacing:.16em}.modal h1{font-size:clamp(42px,10vw,62px);line-height:.97;letter-spacing:-.07em;margin:22px 0 16px}.modal h1 em{color:var(--green);font-style:normal;text-shadow:0 0 24px #98ff6d38}.modal p{color:#899995;font-size:14px;line-height:1.75}.steps{display:grid;gap:9px;margin:23px 0}.steps span{display:flex;gap:12px;color:#c2cfcb;font-size:12px}.steps b{font:700 9px monospace;color:#53625f}.primary{width:100%;height:54px;border:0;border-radius:3px;background:var(--green);color:#071006;font-weight:900;letter-spacing:.08em;cursor:pointer;box-shadow:0 0 30px #98ff6d24}.primary:active{transform:translateY(1px)}.tip{display:block;text-align:center;margin-top:12px;color:#53625f;font-size:10px}.result{text-align:center}.result h2{margin:22px 0 5px;color:var(--green);font:900 clamp(54px,16vw,82px) monospace;letter-spacing:-.08em}.rank{color:#d7e3df!important;font-weight:800}.result-grid{display:grid;grid-template-columns:1fr 1fr;gap:1px;background:var(--line);border:1px solid var(--line);margin:23px 0}.result-grid div{display:grid;gap:8px;padding:16px;background:#0b1216}.result-grid span{font-size:9px;letter-spacing:.1em;color:#657572}.result-grid strong{font:800 20px monospace}.hidden{display:none!important}
    .miss .card{animation:shake .22s;border-color:#ff5477aa}.hit .stimulus{animation:hit .16s}.overdrive{animation:overdrive .75s ease-in-out infinite alternate}.overdrive .card{box-shadow:0 0 75px #98ff6d20,inset 0 0 60px #98ff6d0c}
    @keyframes scan{to{transform:translateY(50%)}}@keyframes hit{50%{transform:scale(1.06);filter:brightness(1.5)}}@keyframes shake{25%{transform:translateX(-7px)}60%{transform:translateX(5px)}}@keyframes overdrive{to{filter:saturate(1.22)}}
    @media(max-width:620px){header{height:62px;width:calc(100% - 22px)}.stage{width:calc(100% - 22px);padding-top:17px}.console{grid-template-columns:1fr;gap:7px}.rule,.energy{min-height:60px}.energy{padding:11px 14px}.card{height:clamp(250px,37vh,330px)}.controls button{height:68px}.stimulus{gap:23px}}
    @media(max-height:730px){header{height:56px}.stage{padding-top:11px}.hud{margin-bottom:9px}.console{margin-bottom:7px}.card{height:230px}.controls{margin-top:7px}.controls button{height:59px}.note{display:none}}
    @media(prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;animation-iteration-count:1!important}}
  </style>
</head>
<body>
  <main class="app" id="app">
    <div class="grid"></div><div class="scan"></div>
    <header>
      <div class="brand"><span class="logo">⌁</span><div><strong>逆光协议</strong><small>NEURAL ARCADE</small></div></div>
      <div class="actions"><div class="best"><small>最高</small><span id="bestTop">0</span></div><button class="sound" id="sound" aria-label="关闭音效">◕</button></div>
    </header>
    <section class="stage" aria-label="游戏区">
      <div class="hud">
        <div class="stat"><span>同步分</span><strong id="score">0</strong></div>
        <div class="center"><div class="hearts" id="hearts"></div><div class="timer"><b id="time">45</b> SEC</div></div>
        <div class="stat right"><span>连击</span><strong><span id="combo">0</span><small id="multi"> ×1</small></strong></div>
      </div>
      <div class="console">
        <div class="rule"><i id="ruleId">协议 01</i><strong id="ruleTitle">服从文字</strong><small id="ruleHint">忽略箭头，只看汉字</small></div>
        <div class="energy"><div class="energy-label"><em>ϟ</em><span id="energyName">超载能量</span><b id="energyText">0%</b></div><div class="track"><i id="energyBar"></i></div></div>
      </div>
      <div class="card">
        <div class="rail"><i id="rail"></i></div><div class="signal-id" id="signalId">SIGNAL / 01</div>
        <div class="stimulus"><div class="big-arrow" id="arrow">←</div><div class="word" id="word">右</div></div>
        <div class="feedback" id="feedback"></div><i class="corner a"></i><i class="corner b"></i>
      </div>
      <div class="controls"><button data-dir="left">←　左<kbd>A</kbd></button><button data-dir="right">右　→<kbd>D</kbd></button></div>
      <p class="note">抑制冲动 · 工作记忆 · 规则切换</p>
    </section>

    <div class="overlay" id="startOverlay">
      <section class="modal"><span class="kicker">✦ 45 秒神经突围</span><h1>别相信你的<br><em>第一反应</em></h1><p>协议会突然切换。压住本能，按当前规则选择左或右，连续判断会把倍率推到最高。</p><div class="steps"><span><b>01</b>读懂顶部协议</span><span><b>02</b>忽略干扰信号</span><span><b>03</b>攒满能量，双倍爆发</span></div><button class="primary" id="start">启动协议　→</button><small class="tip">点击左右键，或使用键盘 A / D</small></section>
    </div>
    <div class="overlay hidden" id="endOverlay">
      <section class="modal result"><span class="kicker">ϟ 本轮连接完成</span><h2 id="finalScore">0</h2><p class="rank" id="rank">C 级 · 刚刚热身</p><div class="result-grid"><div><span>最高连击</span><strong id="maxCombo">0</strong></div><div><span>历史最高</span><strong id="bestEnd">0</strong></div></div><button class="primary" id="again">↻　再来一局</button><small class="tip">分数保存在这台设备上</small></section>
    </div>
  </main>
  <script>
    (()=>{
      const $=id=>document.getElementById(id), app=$('app');
      const rules={
        word:{id:'协议 01',title:'服从文字',hint:'忽略箭头，只看汉字',accent:'#98ff6d'},
        arrow:{id:'协议 02',title:'服从箭头',hint:'忽略汉字，只看箭头',accent:'#6de8ff'},
        invWord:{id:'协议 03',title:'背叛文字',hint:'选择汉字的反方向',accent:'#ffcf5a'},
        invArrow:{id:'协议 04',title:'背叛箭头',hint:'选择箭头的反方向',accent:'#ff70bd'}
      };
      let state={},tickTimer,nextTimer,soundOn=true,locked=true;
      const opposite=d=>d==='left'?'right':'left';
      const prompt=()=>{const word=Math.random()>.5?'left':'right';return{word,arrow:Math.random()>.28?opposite(word):word}};
      const correct=()=>state.rule==='word'?state.prompt.word:state.rule==='arrow'?state.prompt.arrow:state.rule==='invWord'?opposite(state.prompt.word):opposite(state.prompt.arrow);
      const fmt=n=>Math.round(n).toLocaleString('zh-CN');
      const tone=(f,d=.07)=>{if(!soundOn)return;try{const C=window.AudioContext||window.webkitAudioContext,c=new C,o=c.createOscillator(),g=c.createGain();o.frequency.value=f;g.gain.setValueAtTime(.05,c.currentTime);g.gain.exponentialRampToValueAtTime(.001,c.currentTime+d);o.connect(g);g.connect(c.destination);o.start();o.stop(c.currentTime+d)}catch(e){}};
      const renderHearts=()=>{$('hearts').innerHTML=[0,1,2].map(i=>`<span class="heart ${i<state.lives?'alive':''}">♥</span>`).join('')};
      const render=()=>{
        const r=rules[state.rule],now=Date.now(),over=now<state.overUntil;
        app.style.setProperty('--accent',r.accent); app.classList.toggle('overdrive',over);
        $('score').textContent=fmt(state.score);$('combo').textContent=state.combo;$('multi').textContent=` ×${over?2:Math.min(5,1+Math.floor(state.combo/4))}`;
        $('time').textContent=Math.max(0,Math.ceil((state.endAt-now)/1000));$('ruleId').textContent=r.id;$('ruleTitle').textContent=r.title;$('ruleHint').textContent=r.hint;
        $('arrow').textContent=state.prompt.arrow==='left'?'←':'→';$('word').textContent=state.prompt.word==='left'?'左':'右';$('signalId').textContent=`SIGNAL / ${String(state.turn+1).padStart(2,'0')}`;
        $('energyName').textContent=over?'超载中 · 双倍':'超载能量';$('energyText').textContent=over?'2X':`${state.energy}%`;$('energyBar').style.width=`${over?100:state.energy}%`;renderHearts();
      };
      const chooseRule=()=>{const pool=state.turn<5?['word','arrow']:Object.keys(rules),available=pool.filter(x=>x!==state.rule);state.rule=available[Math.floor(Math.random()*available.length)]};
      const next=()=>{if(!state.playing)return;state.turn++;let switched=false;if(state.turn%5===0){chooseRule();switched=true}state.prompt=prompt();state.deadline=Date.now()+Math.max(1450,2600-state.turn*16);locked=false;$('feedback').textContent=switched?'协议已切换':'';app.classList.remove('hit','miss');render()};
      const finish=()=>{if(!state.playing)return;state.playing=false;locked=true;clearInterval(tickTimer);clearTimeout(nextTimer);const best=Math.max(Number(localStorage.getItem('niguang-best')||0),state.score);localStorage.setItem('niguang-best',best);$('bestTop').textContent=fmt(best);$('finalScore').textContent=fmt(state.score);$('maxCombo').textContent=state.maxCombo;$('bestEnd').textContent=fmt(best);$('rank').textContent=state.score>=6500?'S 级 · 规则掠夺者':state.score>=4000?'A 级 · 神经骑手':state.score>=2200?'B 级 · 信号猎人':'C 级 · 刚刚热身';$('endOverlay').classList.remove('hidden');tone(220,.24)};
      const answer=choice=>{if(!state.playing||locked)return;locked=true;const ok=choice===correct(),now=Date.now(),over=now<state.overUntil,multi=over?2:Math.min(5,1+Math.floor(state.combo/4));
        if(ok){state.combo++;state.maxCombo=Math.max(state.maxCombo,state.combo);state.score+=(100+Math.round(Math.max(0,(state.deadline-now)/2600)*75))*multi;state.energy+=14;if(state.energy>=100){state.energy=0;state.overUntil=now+5200}app.classList.add('hit');$('feedback').textContent='完美同步';tone(over?820:610+Math.min(state.combo,8)*24);if(navigator.vibrate)navigator.vibrate(12)}
        else{state.combo=0;state.lives--;app.classList.add('miss');$('feedback').textContent=`信号中断 · 正确是${correct()==='left'?'左':'右'}`;tone(135,.13);if(navigator.vibrate)navigator.vibrate([28,20,28]);if(state.lives<=0)setTimeout(finish,260)}render();nextTimer=setTimeout(next,ok?155:260)};
      const tick=()=>{if(!state.playing)return;const now=Date.now();$('time').textContent=Math.max(0,Math.ceil((state.endAt-now)/1000));$('rail').style.transform=`scaleX(${Math.max(0,Math.min(1,(state.deadline-now)/2600))})`;app.classList.toggle('overdrive',now<state.overUntil);if(now>=state.endAt)finish();else if(now>=state.deadline)answer(null)};
      const start=()=>{clearInterval(tickTimer);clearTimeout(nextTimer);const now=Date.now();state={playing:true,score:0,combo:0,maxCombo:0,lives:3,energy:0,rule:'word',prompt:prompt(),turn:0,deadline:now+2600,endAt:now+45000,overUntil:0};locked=false;$('startOverlay').classList.add('hidden');$('endOverlay').classList.add('hidden');$('feedback').textContent='';app.classList.remove('hit','miss','overdrive');render();tickTimer=setInterval(tick,50);tone(440,.09)};
      document.querySelectorAll('[data-dir]').forEach(b=>b.addEventListener('pointerdown',()=>answer(b.dataset.dir)));
      document.addEventListener('keydown',e=>{if(e.repeat)return;if(e.key==='ArrowLeft'||e.key.toLowerCase()==='a')answer('left');if(e.key==='ArrowRight'||e.key.toLowerCase()==='d')answer('right')});
      $('start').onclick=start;$('again').onclick=start;$('sound').onclick=()=>{soundOn=!soundOn;$('sound').textContent=soundOn?'◕':'○';$('sound').ariaLabel=soundOn?'关闭音效':'开启音效'};
      $('bestTop').textContent=fmt(Number(localStorage.getItem('niguang-best')||0));state={playing:false,score:0,combo:0,lives:3,energy:0,rule:'word',prompt:prompt(),turn:0,deadline:Date.now()+2600,endAt:Date.now()+45000,overUntil:0};render();
    })();
  </script>
</body>
</html>
